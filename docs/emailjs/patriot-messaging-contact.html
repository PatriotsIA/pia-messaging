<div style="font-family: Arial, sans-serif; color: #182433; line-height: 1.6; max-width: 640px; margin: 0 auto;">
  <div style="border-bottom: 4px solid #ba2028; padding: 20px 0;">
    <p style="margin: 0; color: #173f75; font-size: 22px; font-weight: bold;">Patriot Messaging</p>
    <p style="margin: 4px 0 0;">New website inquiry</p>
  </div>
  <h1 style="font-size: 20px; margin: 24px 0 16px;">{{title}}</h1>
  <p>
    <strong>Name:</strong> {{name}}<br>
    <strong>Email:</strong> {{email}}<br>
    <strong>Submitted:</strong> {{submitted_at}}<br>
    <strong>Page:</strong> {{page_url}}
  </p>
  <div style="white-space: pre-wrap; overflow-wrap: anywhere; padding: 16px; background-color: #f3f5f8;">{{message}}</div>
  <p style="font-size: 13px; color: #526171; margin-top: 24px;">Sent from the Patriot Messaging website. Reply to this email to respond to the visitor.</p>
</div>
